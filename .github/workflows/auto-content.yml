name: Weekly Content Automation

on:
  schedule:
    # Every Monday at 8:00 AM UTC
    - cron: '0 8 * * 1'
  workflow_dispatch:  # Manual trigger from GitHub Actions tab

jobs:
  generate-content:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install google-genai

      - name: Generate weekly blog post
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python .github/scripts/generate_post.py

      - name: Generate Pinterest pin pack
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python .github/scripts/generate_pins.py

      - name: Commit new content
        run: |
          git config --global user.name "Inkspire Bot"
          git config --global user.email "buildsenseit@gmail.com"
          git add -A
          git diff --staged --quiet || git commit -m "Auto: weekly content $(date +'%Y-%m-%d')"
          git push
